name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read

jobs:
  validate-dotnet:
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        working-directory: Gravitas
    env:
      # PRs select their target branch: develop -> main must validate released packages.
      UseLocalLsfStack: ${{ (github.base_ref == 'develop' || github.ref == 'refs/heads/develop') && 'true' || 'false' }}
      GRAVITAS_REPLAY_CAPTURE_DIRECTORY: ${{ github.workspace }}/artifacts/replay/${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.configuration }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, arch: x64, runner: ubuntu-24.04 }
          - { os: windows, arch: x64, runner: windows-2025 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: arm64, runner: windows-11-arm }
        configuration: [Release, ReleaseLean]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: Gravitas
          fetch-depth: 0
          persist-credentials: false

      # Develop uses immutable revisions; package lanes never check out sibling sources.
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/FixedMathSharp
          ref: d0d316053f6207b5624182ee1336ecaf142f25c6
          path: FixedMathSharp
          persist-credentials: false
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/SwiftCollections
          ref: 22c0de88c7449e1cd15d54007876bceade643b44
          path: SwiftCollections
          persist-credentials: false
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/GridForge
          ref: 89c69f6ebf0bb00cadbc63685b59946e60872b30
          path: GridForge
          persist-credentials: false
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/Chronicler
          ref: c547e5c633ec71bb3cd0e072720a75fb9b8580ad
          path: Chronicler
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          architecture: ${{ matrix.platform.arch }}
          dotnet-version: |
            10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.4.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          targetPath: Gravitas

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-
            ${{ runner.os }}-${{ runner.arch }}-lsf-${{ env.UseLocalLsfStack }}-nuget-

      - name: Restore dependencies
        # Inferred sibling references lose identity metadata and can compile the same output concurrently.
        run: dotnet restore Gravitas.slnx --property:Configuration=${{ matrix.configuration }} -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }}

      - name: Build Solution
        run: dotnet build Gravitas.slnx --configuration ${{ matrix.configuration }} --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }}

      - name: Record source and SDK provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Gravitas revision' }
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify SDK' }
          $dependencies = [ordered]@{}
          if ($env:UseLocalLsfStack -eq 'true') {
            foreach ($repository in @('FixedMathSharp', 'SwiftCollections', 'GridForge', 'Chronicler')) {
              $dependencies[$repository] = git -C "../$repository" rev-parse HEAD
              if ($LASTEXITCODE -ne 0) { throw "Cannot identify $repository revision" }
            }
          }
          "GRAVITAS_REPLAY_SOURCE_REVISION=$revision" >> $env:GITHUB_ENV
          "GRAVITAS_REPLAY_SDK_VERSION=$sdk" >> $env:GITHUB_ENV
          "GRAVITAS_REPLAY_DEPENDENCY_REVISIONS=$($dependencies | ConvertTo-Json -Compress)" >> $env:GITHUB_ENV

      - name: Run Tests and capture replay observations
        id: tests
        # A discovery crash must fail this step even when VSTest reports no tests.
        run: dotnet test Gravitas.slnx --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }} --verbosity normal -- RunConfiguration.TreatNoTestsAsError=true

      - name: Retain replay observations and actual process provenance
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.configuration }}
          path: artifacts/replay/${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 14

  compare-replay:
    needs: validate-dotnet
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful native validation
        if: needs.validate-dotnet.result != 'success'
        run: |
          echo "::error::Native validation did not succeed (${{ needs.validate-dotnet.result }}); replay comparison cannot run."
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download native replay captures
        uses: actions/download-artifact@v8
        with:
          pattern: "*-*-Release*"
          path: artifacts/replay
      - name: Compare all required native lanes
        # Each artifact retains its lane directory instead of merging files.
        run: |
          python3 .github/scripts/compare_replay_captures.py --captures artifacts/replay --fixtures tests/Gravitas.Tests/Determinism/Fixtures

  validate-wiki-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate wiki link rewrite helper
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/rewrite_wiki_links_for_github_wiki_tests.py
